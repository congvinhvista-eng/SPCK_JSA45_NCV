<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JapaneseTourist || Home</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/weather.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="icon" type="image/x-icon" href="css/icon.png" />
  </head>
  <body>
    <nav>
      <a class="brand" href="index.html">JapaneseTourist</a>

      <a
        class="btn1"
        href="itinerary.html"
        id="itiBtn"
        data-translate="itinerary"
        >Itinerary Tour</a
      >

      <a
        class="btn1"
        href="recommended.html"
        id="rcmBtn"
        data-translate="rcmBtn"
        >Recommended Tours</a
      >

      <a class="btn1" href="food.html" id="foodRcm" data-translate="foodRcm"
        >Food Recommendations</a
      >
      <a
        class="btn1"
        href="currency.html"
        id="currencyBtn"
        data-translate="currencyBtn"
        >Currency Converter</a
      >
      <a
        class="btn1"
        href="culture.html"
        id="cultureBtn"
        data-translate="cultureBtn"
        >Japanese Culture</a
      >
      <a
        class="btn1"
        href="weather.html"
        id="weatherBtn"
        data-translate="weatherBtn"
        >Weather</a
      >

      <label class="language-picker" for="language-select">
        <span class="sr-only">Chọn ngôn ngữ</span>
        <select id="language-select" aria-label="Chọn ngôn ngữ">
          <option value="vi">VI</option>
          <option value="ja">JP</option>
          <option value="en">EN</option>
        </select>
      </label>
      <div class="user-menu">
        <div class="user" id="currentUser" data-translate="currentUser">
          User
        </div>

        <button id="logoutBtn" style="display: none" data-translate="logoutBtn">
          Đăng xuất
        </button>
      </div>
    </nav>

    <!-- hero -->
    <section class="weather-hero">
      <video autoplay muted loop playsinline>
        <source src="css/weather.mp4" type="video/mp4" />
      </video>

      <div class="weather-overlay">
        <h1 data-translate="weatherTitle">Weather in Japan</h1>

        <p data-translate="weatherDesc">
          Check weather forecasts before your trip.
        </p>
      </div>
    </section>
    <!-- container -->
    <section class="weather-container">
      <h1 data-translate="weatherTitle">Weather in Japan</h1>

      <select id="citySelect">
        <option value="Tokyo">Tokyo</option>
        <option value="Osaka">Osaka</option>
        <option value="Kyoto">Kyoto</option>
        <option value="Hokkaido">Sapporo</option>
        <option value="Okinawa">Naha</option>
      </select>

      <div id="weather-card"></div>
    </section>
    <footer class="footer">
      <p>&copy; 2023 JapaneseTourist. All rights reserved.</p>
      <div class="footer-icons">
        <!-- Facebook -->
        <a href="https://www.facebook.com/vinh.nguyen.337736/" target="_blank">
          <i class="fa-brands fa-facebook"></i>
        </a>
        <!-- TikTok -->
        <a href="https://www.tiktok.com/@lowkey.boy607" target="_blank">
          <i class="fa-brands fa-tiktok"></i>
        </a>
        <!-- Instagram -->
        <a href="https://www.instagram.com/nguyenvinh.pb" target="_blank">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>
    </footer>
    <script src="js/nav-main.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/chatbot.js"></script>
  </body>
</html>
